apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comments
  template:
    metadata:
      labels:
        app: comments
    spec:
      containers:
        - name: comments
          image: microservices-demo-comments:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: CORS_ORIGIN
              value: "http://localhost:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: comments
spec:
  selector:
    app: comments
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
