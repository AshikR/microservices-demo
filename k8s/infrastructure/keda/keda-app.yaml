apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-keda
  namespace: argocd
spec:
  project: microservices-demo-governance
  source:
    repoURL: 'https://kedacore.github.io/charts' 
    chart: keda
    targetRevision: 2.12.0
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
