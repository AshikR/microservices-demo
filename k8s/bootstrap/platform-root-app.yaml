apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-root
  namespace: argocd

spec:
  project: microservices-demo-governance

  source:
    repoURL: https://github.com/AshikR/microservices-demo.git
    targetRevision: dev
    path: k8s/infrastructure

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
