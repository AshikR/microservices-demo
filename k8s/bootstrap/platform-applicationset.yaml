apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-applicationset
  namespace: argocd
spec:
  generators:
    - list:
        elements:    
          - appName: infrastructure-alb-controller
            appPath: k8s/infrastructure/alb-controller
            targetNamespace: kube-system
            syncWave: "1"
      
          - appName: infrastructure-keda
            appPath: k8s/infrastructure/keda
            targetNamespace: keda
            syncWave: "2"

          - appName: infrastructure-monitoring
            appPath: k8s/infrastructure/monitoring
            targetNamespace: monitoring
            syncWave: "3"

          - appName: microservices-demo-prod
            appPath: k8s/environments
            targetNamespace: prod-env
            syncWave: "4"

  template:
    metadata:
      name: "{{appName}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
    spec:
      project: microservices-demo-governance
      source:
        repoURL: 'https://github.com/AshikR/microservices-demo.git'
        targetRevision: dev
        path: "{{appPath}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{targetNamespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
