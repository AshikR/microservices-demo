apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: microservices-demo-governance
  namespace: argocd
spec:
  description: "Enterprise Governance Perimeter"
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  sourceRepos:
    - '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
