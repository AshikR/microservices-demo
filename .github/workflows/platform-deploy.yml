name: Platform Deploy

on:
  push:
    branches: [main]
    paths:
      - '.demo/terraform-project/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-vpc:
    name: Deploy VPC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::657830185735:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Setup Terragrunt
        run: |
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Deploy VPC
        run: |
          cd .demo/terraform-project/infra/vpc
          terragrunt apply --terragrunt-non-interactive -auto-approve

  deploy-eks:
    name: Deploy EKS
    runs-on: ubuntu-latest
    needs: deploy-vpc
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::657830185735:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Setup Terragrunt
        run: |
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Deploy EKS
        run: |
          cd .demo/terraform-project/infra/eks
          terragrunt apply --terragrunt-non-interactive -auto-approve
