name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=microservices-platform
            -Dsonar.projectKey=microservices-platform_microservices-demo

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table

  build-and-scan:
    name: Build and Scan Images
    runs-on: ubuntu-latest
    needs: [sonarcloud, trivy-fs]
    strategy:
      matrix:
        service: [posts, comments, query, event-bus, moderation, client]
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t microservices-demo-${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: microservices-demo-${{ matrix.service }}:latest
          severity: CRITICAL,HIGH
          format: table

  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Checkov k8s scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true
